services:
  - type: web
    name: cookiekub-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.db.migrate && python -m backend.db.seed && gunicorn backend.wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MAINTENANCE_TOKEN
        generateValue: true
      - key: APP_ENV
        value: production
      - key: SUPPORT_EMAIL
        value: support@cookiekub.ru
      - key: ORDER_COMPLETE_DELAY_SECONDS
        value: "60"
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: https://USERNAME.github.io
