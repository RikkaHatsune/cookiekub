<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cookiekub-api.onrender.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Внутренняя ошибка CookieKub. Обновите страницу или вернитесь на главную.">
<title>500 — печка перегрелась — CookieKub</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="500">
<a class="skip-link" href="#main">К содержимому</a>
<div id="site-header"></div>
<main id="main">
  <section class="error-wrap">
    <div class="container error-card">
      <div class="error-art" aria-hidden="true">500</div>
      <h1>Печка перегрелась</h1>
      <p>Что-то пошло не так на нашей стороне. Попробуйте обновить страницу — обычно этого достаточно. Если нет, вернитесь на главную: печеньки никуда не убежали.</p>
      <div class="cluster">
        <button class="btn btn-primary" type="button" id="reload-page">Обновить</button>
        <a class="btn btn-ghost" href="index.html">На главную</a>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/static-page.js" defer></script>
</body>
</html>
